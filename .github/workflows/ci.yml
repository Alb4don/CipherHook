name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherhook
          POSTGRES_PASSWORD: cipherhook
          POSTGRES_DB: cipherhook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherhook -d cipherhook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Tests and fuzzing
        env:
          TEST_POSTGRES_URL: postgres://cipherhook:cipherhook@localhost:5432/cipherhook_test
          FUZZ_RUNS: "1000"
          FUZZ_HTTP_RUNS: "2000"
        run: npm test
