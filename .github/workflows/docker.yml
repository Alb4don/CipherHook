name: docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cipherhook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image must not contain secrets or test code
        run: |
          docker run --rm --entrypoint sh cipherhook:ci -c 'test ! -e /app/keys && test ! -e /app/.env && test ! -e /app/test && test ! -e /app/node_modules/fast-check'
